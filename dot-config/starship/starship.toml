add_newline = false
format = """$username$hostname$nix_shell$conda$directory$character"""
palette = "catppuccin_mocha"
right_format = """$git_branch$git_status$cmd_duration$jobs"""
command_timeout = 1000

[username]
style_user = 'bold lavender'
style_root = 'bold red'
format = '[$user]($style) '
show_always = false

[hostname]
ssh_only = true
style = 'bold teal'
format = '[@$hostname]($style) '

[nix_shell]
style = 'bold mauve'
format = '[$symbol$state( \($name\))]($style) '
symbol = '❄️ '

[conda]
style = 'bold green'
format = '[$symbol$environment]($style) '
symbol = '🐍 '

[character]
success_symbol = '[➜ ](bold peach)'
error_symbol = '[➜ ](bold red)'

[directory]
style = 'bold cyan'
read_only = ' 🔒'
truncate_to_repo = true

[directory.substitutions]
'~/tests/starship-custom' = 'work-project'

[git_branch]
symbol = ' '
style = 'bold purple'

[git_commit]
format = ''

[git_status]
format = '[$ahead_behind]($style) '
style = 'bold red'

[cmd_duration]
format = '[$duration]($style) '
style = 'bold yellow'

[jobs]
symbol = '⚡'
format = '[$symbol$number]($style) '

[aws]
disabled = true

# [gcloud]
# format = '[$symbol$account(\($project\))]($style) '
# style = 'bold blue'

[golang]
format = '[ ](bold cyan)'

[kubernetes]
disabled = true

[docker_context]
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
